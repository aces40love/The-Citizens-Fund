name: Publish website preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir _site
          cp index.html styles.css site.js inquiry.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
